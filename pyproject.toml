[project]
name = "hunterMakesPy"
version = "0.10.0"
description = "Easy Python functions making making functional Python functions easier."
readme = "README.md"
requires-python = ">=3.12"
license = "CC-BY-NC-4.0"
authors = [{ name = "Hunter Hogan", email = "HunterHogan@pm.me" }]
keywords = [
  "input validation",
  "module loading",
  "package settings",
  "parameter validation",
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Framework :: Pytest",
  "Intended Audience :: Developers",
  "Natural Language :: English",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.15",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: Utilities",
  "Typing :: Typed",
]
dependencies = [
  "Z0Z_tools>=4.0.0",
  "autoflake",
  "charset_normalizer",
  "isort",
  "more_itertools",
  "numpy>=2.0",
  "typing_extensions>=4.10.0"
]
optional-dependencies = { development = ["pytest-cov"], testing = [
  "hypothesis",
  "pytest>=9.0",
  "pytest-xdist"
] }

[project.urls]
Documentation = "https://context7.com/hunterhogan/huntermakespy"
Donate = "https://www.patreon.com/integrated"
Homepage = "https://github.com/hunterhogan/hunterMakesPy"
Issues = "https://github.com/hunterhogan/hunterMakesPy/issues"
Repository = "https://github.com/hunterhogan/hunterMakesPy"

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.coverage]
report = { exclude_also = [
  "@overload",
  "^\\s*\\.\\.\\.$",
  "if __name__ == \"__main__\":",
  "if TYPE_CHECKING:",
], ignore_errors = false }
run = { branch = true, data_file = "hunterMakesPy/tests/coverage/.coverage", omit = [
  "hunterMakesPy/tests/*"
], source = ["."] }

[tool.pytest]
addopts = ["--color=yes"]
empty_parameter_set_mark = "fail_at_collect"
filterwarnings = ["error"]
log_auto_indent = "On"
minversion = "9.0"
strict = true
testpaths = ["hunterMakesPy/tests"]

[tool.setuptools]
package-data = { "*" = ["py.typed"] }
packages = ["hunterMakesPy", "hunterMakesPy.tests", "hunterMakesPy.tests.dataSamples"]

[tool.updateCitation]
filenameCitationDOTcff = "CITATION.cff"
pathFilenameCitationSSOT = "citations/CITATION.cff"
