# path-sync copy -n shared
[project]
name = "hunterMakesPy"
version = "0.10.1"
description = "Easy Python functions making making functional Python functions easier."
readme = "README.md"
requires-python = ">=3.12"
license = "CC-BY-NC-4.0"
authors = [{ name = "Hunter Hogan", email = "HunterHogan@pm.me" }]
keywords = [
  "input validation",
  "module loading",
  "package settings",
  "parameter validation",
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Framework :: Pytest",
  "Intended Audience :: Developers",
  "Natural Language :: English",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.15",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: Utilities",
  "Typing :: Typed",
]
dependencies = ["Z0Z_tools>=4.1.1", "autoflake", "charset_normalizer", "isort", "more_itertools", "numpy>=2.0", "typing_extensions>=4.10.0"]
optional-dependencies = { development = ["pytest-cov"], testing = ["hypothesis", "pytest>=9.0", "pytest-xdist"] }

[project.urls]
Documentation = "https://context7.com/hunterhogan/huntermakespy"
Donate = "https://www.patreon.com/integrated"
Homepage = "https://github.com/hunterhogan/hunterMakesPy"
Issues = "https://github.com/hunterhogan/hunterMakesPy/issues"
Repository = "https://github.com/hunterhogan/hunterMakesPy"

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.coverage]
report = { exclude_also = [
  "@overload",
  "^\\s*\\.\\.\\.$",
  "if __name__ == \"__main__\":",
  "if TYPE_CHECKING:",
], ignore_errors = false }
run = { branch = true, data_file = "hunterMakesPy/tests/coverage/.coverage", omit = ["hunterMakesPy/tests/*"], source = ["."] }

# === DO_NOT_EDIT: path-sync shared ===
[tool.isort]
add_imports = ["from __future__ import annotations"]
combine_as_imports = true
extend_skip_glob = ["*.ipynb", "*.pyi"]
filter_files = true
force_alphabetical_sort_within_sections = true
from_first = true
honor_noqa = true
indent = "\t"
line_length = 140
lines_after_imports = 1
lines_between_types = 0
multi_line_output = 4
no_sections = true
overwrite_in_place = true
use_parentheses = true
# === OK_EDIT: path-sync shared ===

# === DO_NOT_EDIT: path-sync shared ===
[tool.pyrefly]
preset = "strict"
enabled-ignores = ["pyrefly"]
infer-with-first-use = false
project-excludes = [
  "typings",
  "typings/**/*",
  "**/node_modules",
  "**/__pycache__",
  "**/.*",
  ".venv",
  ".vAnalysis",
]
# === OK_EDIT: path-sync shared ===

# === DO_NOT_EDIT: path-sync shared ===
[tool.pyrefly.errors]
bad-return = "warn"
invalid-type-var = "warn"
invalid-yield = "warn"
protected-access = "warn"
redundant-condition = "warn"
# === OK_EDIT: path-sync shared ===

# === DO_NOT_EDIT: path-sync shared ===
[tool.pyright]
deprecateTypingAliases = true
disableBytesTypePromotions = true
enableReachabilityAnalysis = true
enableTypeIgnoreComments = false
exclude = ["typings", "typings/**", "**/node_modules", "**/__pycache__", "**/.*", ".venv", ".vAnalysis"]
reportConstantRedefinition = false
reportInvalidTypeVarUse = false
reportPrivateUsage = false
reportReturnType = "warning"
reportUnnecessaryIsInstance = false
reportUnusedClass = "information"
reportUnusedExpression = "information"
reportUnusedFunction = "information"
reportUnusedImport = "information"
reportUnusedVariable = "information"
strictDictionaryInference = true
strictListInference = true
strictSetInference = true
typeCheckingMode = "strict"
# === OK_EDIT: path-sync shared ===

[tool.pytest]
addopts = ["--color=yes"]
empty_parameter_set_mark = "fail_at_collect"
filterwarnings = ["error"]
log_auto_indent = "On"
minversion = "9.0"
strict = true
testpaths = ["hunterMakesPy/tests"]

# === DO_NOT_EDIT: path-sync shared ===
[tool.ruff]
line-length = 140
# === OK_EDIT: path-sync shared ===

# === DO_NOT_EDIT: path-sync shared ===
[tool.ruff.lint]
preview = true
allowed-confusables = [
  "–",
  "’",
  "′",
  "×",
  "−",
  "∖",
  "∗",
  "∣",
  "∨",
  "∪",
  "∼",
  "⊗",
  "ℂ",
  "ℋ",
  "ℒ",
  "ℓ",
  "ℕ",
  "ℙ",
  "ℚ",
  "ℝ",
  "ℤ",
  "ℰ",
  "ℱ",
  "𝒪",
  "𝒮",
  "𝔼",
  "𝕀",
  "𝟙",
  "α",
  "Β",
  "γ",
  "ι",
  "Κ",
  "ν",
  "ο",
  "ρ",
  "σ",
]
ignore = [
  "any-type",
  "bad-quotes-inline-string",
  "blank-lines-after-function-or-class",
  "blank-lines-top-level",
  "blanket-noqa",
  "complex-structure",
  "dict-index-missing-items",
  "docstring-in-stub",
  "docstring-missing-exception",
  "docstring-missing-returns",
  "docstring-missing-yields",
  "docstring-tab-indentation",
  "explicit-f-string-type-conversion",
  "FIX",
  "I",
  "if-else-block-instead-of-if-exp",
  "incorrect-blank-line-after-class",
  "incorrect-section-order",
  "line-too-long",
  "magic-value-comparison",
  "missing-copyright-notice",
  "missing-newline-at-end-of-file",
  "missing-trailing-comma",
  "missing-trailing-period",
  "N",
  "no-space-after-block-comment",
  "non-ascii-import-name",
  "non-ascii-name",
  "non-imperative-mood",
  "non-pep695-type-alias",
  "redefined-loop-name",
  "redundant-numeric-union",
  "self-or-cls-assignment",
  "snake-case-type-alias",
  "static-join-to-f-string",
  "subclass-builtin",
  "subprocess-without-shell-equals-true",
  "superfluous-else-continue",
  "superfluous-else-return",
  "suspicious-pickle-import",
  "tab-indentation",
  "TD",
  "too-many-arguments",
  "too-many-blank-lines",
  "too-many-branches",
  "too-many-locals",
  "too-many-nested-blocks",
  "too-many-positional-arguments",
  "too-many-public-methods",
  "too-many-statements",
  "type-name-incorrect-variance",
  "typed-argument-default-in-stub",
  "unnecessary-literal-dict",
  "unused-import",
  "unused-variable",
  "useless-else-on-loop",
  "useless-import-alias",
  "yoda-conditions",
]
select = ["ALL"]
task-tags = ["DEVELOPMENT", "FailEarly", "NOTE", "SEMIOTICS", "TODO"]
# === OK_EDIT: path-sync shared ===

# === DO_NOT_EDIT: path-sync shared ===
[tool.ruff.lint.flake8-comprehensions]
allow-dict-calls-with-keyword-arguments = true
# === OK_EDIT: path-sync shared ===

# === DO_NOT_EDIT: path-sync shared ===
[tool.ruff.lint.flake8-import-conventions]
banned-aliases = { numpy = ["np"], optype = ["op"], pandas = ["pd"], polars = ["pl"], regex = ["re"] }
# === OK_EDIT: path-sync shared ===

# === DO_NOT_EDIT: path-sync shared ===
[tool.ruff.lint.flake8-import-conventions.aliases]
"accelerate.utils.dataclasses" = "accelerate_dataclasses"
"fs.path" = "fs_path"
"gmpy2.bit_test" = "isBit1吗"
"gmpy2.is_even" = "isEven吗"
"gmpy2.is_odd" = "isOdd吗"
"humpy_cytoolz.assoc" = "associateKeyValue"
"humpy_cytoolz.curry" = "syntacticCurry"
"humpy_cytoolz.groupby" = "toolz_groupby"
"itertools.product" = "CartesianProduct"
"math.comb" = "nCr"
"more_itertools.all_unique" = "allUnique吗"
"regex" = "regex"
"scipy" = "scipy"
"sympy.binomial" = "sympy_binomial"
"sympy.catalan" = "sympy_catalan"
"sympy.functions.combinatorial.factorials.binomial" = "sympy_binomial"
"sympy.functions.combinatorial.numbers.catalan" = "sympy_catalan"
"sympy" = "sympy"
"torch.autograd.grad" = "torch_grad"
"torch.nn.functional" = "F"
"torch.nn.parallel.DistributedDataParallel" = "DDP"
numpy = "numpy"
pandas = "pandas"
polars = "polars"
re = "regex"
# === OK_EDIT: path-sync shared ===

# === DO_NOT_EDIT: path-sync shared ===
[tool.ruff.lint.flake8-quotes]
inline-quotes = "single"
# === OK_EDIT: path-sync shared ===

# === DO_NOT_EDIT: path-sync shared ===
[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["useless-import-alias"]
"*test*.py" = [
  "ARG",
  "assert",
  "BLE",
  "D",
  "docstring-missing-returns",
  "DTZ",
  "FBT",
  "PT",
  "suspicious-non-cryptographic-random-usage",
  "TRY",
]
# === OK_EDIT: path-sync shared ===

# === DO_NOT_EDIT: path-sync shared ===
[tool.ruff.lint.pydocstyle]
convention = "numpy"
# === OK_EDIT: path-sync shared ===

# === DO_NOT_EDIT: path-sync shared ===
[tool.ruff.format]
docstring-code-format = true
quote-style = "single"
indent-style = "tab"
skip-magic-trailing-comma = true
# === OK_EDIT: path-sync shared ===

[tool.setuptools]
package-data = { "*" = ["py.typed"] }
packages = ["hunterMakesPy", "hunterMakesPy.tests", "hunterMakesPy.tests.dataSamples"]

# === DO_NOT_EDIT: path-sync shared ===
[tool.tombi.format.rules]
line-ending = "lf"
# === OK_EDIT: path-sync shared ===

# === DO_NOT_EDIT: path-sync shared ===
[tool.ty.analysis]
respect-type-ignore-comments = false
# === OK_EDIT: path-sync shared ===

# === DO_NOT_EDIT: path-sync shared ===
[tool.ty.environment]
extra-paths = ["./typings"]
python-platform = "all"
# === OK_EDIT: path-sync shared ===

[tool.updateCitation]
filenameCitationDOTcff = "CITATION.cff"
pathFilenameCitationSSOT = "citations/CITATION.cff"
