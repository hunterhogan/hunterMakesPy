name: Refresh Context7 Docs

on:
  workflow_run:
    workflows: ["Make PyPI Release"]
    types: [completed]

permissions:
  actions: read
  contents: read

jobs:
  refresh:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Confirm PyPI publication
        id: checkPublish
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          from json import loads
          from os import environ
          from pathlib import Path
          from subprocess import check_output

          run = loads(Path(environ["GITHUB_EVENT_PATH"]).read_text(encoding="utf-8"))["workflow_run"]
          conclusions = check_output(
              [
                  "gh", "api", "--paginate",
                  f"repos/{environ['GITHUB_REPOSITORY']}/actions/runs/{run['id']}/attempts/{run['run_attempt']}/jobs",
                  "--jq",
                  (
                      '.jobs[] | select(.name == "pypi-publish") | .conclusion, '
                      '(.steps[]? | select(.name == "Publish to PyPI") | .conclusion)'
                  ),
              ],
              text=True,
          )
          if conclusions.splitlines() == ["success", "success"]:
              with Path(environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
                  output.write("published=true\n")

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.checkPublish.outputs.published == 'true'
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
          sparse-checkout: /context7.json
          sparse-checkout-cone-mode: false

      - name: Request Context7 refresh
        if: steps.checkPublish.outputs.published == 'true' && hashFiles('context7.json') != ''
        shell: python
        env:
          CONTEXT7_API_KEY: ${{ secrets.CONTEXT7_API_KEY }}
        run: |
          from json import dumps, loads
          from os import environ
          from pathlib import Path
          from urllib.parse import urlsplit
          from urllib.request import Request, urlopen

          url: str = loads(Path("context7.json").read_text(encoding="utf-8")).get("url", "")
          libraryName = urlsplit(url).path.rstrip("/") or f"/{environ['GITHUB_REPOSITORY']}"
          request = Request(
              "https://context7.com/api/v1/refresh",
              data=dumps({"libraryName": libraryName}).encode("utf-8"),
              headers={
                  "Authorization": f"Bearer {environ['CONTEXT7_API_KEY']}",
                  "Content-Type": "application/json",
              },
              method="POST",
          )
          with urlopen(request, timeout=30):
              pass
